name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Um push novo no mesmo PR cancela a verificação anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      # Versão fixa: com `lts/*`, o CI trocaria de Node sozinho a cada LTS nova.
      # Atualize-a de propósito, depois de rodar os testes na versão nova.
      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Compara as dependências com a tabela do pacote `expo` instalado
      # (fixada pelo package-lock.json), e não com a lista que a Expo publica
      # online e atualiza a cada patch do SDK 58. Sem isso, o job quebra sempre
      # que sai um patch novo, mesmo sem nenhuma mudança no projeto.
      # A versão do expo-doctor também é fixa: atualize-a de propósito.
      - name: Verificar compatibilidade com o SDK do Expo
        run: npx --yes expo-doctor@1.21.8
        env:
          EXPO_OFFLINE: "1"

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Lint
        run: |
          if ls eslint.config.* > /dev/null 2>&1; then
            npx expo lint
          else
            echo "ESLint ainda não configurado. Rode 'npx expo lint' localmente uma vez e versione a configuração."
          fi

      - name: Testes
        run: npm run test --if-present

      - name: Garantir que o app não acessa a rede
        run: |
          if grep -rnE '\bfetch\(|\baxios\b|XMLHttpRequest|\bWebSocket\b' src; then
            echo "::error::Chamada de rede encontrada em src/. O app funciona sem rede (veja AGENTS.md)."
            exit 1
          fi

      - name: Gerar o bundle Android
        run: npx expo export --platform android --output-dir dist/android

      - name: Gerar o bundle iOS
        run: npx expo export --platform ios --output-dir dist/ios
